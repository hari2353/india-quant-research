name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'  # weekly dependency audit (NIST 800-53 RA-5 hygiene)

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install auditor
        run: pip install pip-audit --quiet
      - name: Install the package so audits include transitive deps
        run: pip install -e . --quiet
      - name: Audit installed dependency tree (RA-5)
        run: pip-audit
